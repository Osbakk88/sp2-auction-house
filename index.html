<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300..700&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Home | Atrium Auctionarium</title>
  </head>
  <body class="min-h-screen flex flex-col bg-[#0B0B0C] text-[#F4D18B]">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-6 py-8">
      <section class="py-12 md:py-20">
        <h1 class="font-display text-4xl text-[#F4D18B] md:text-5xl">
          Bid on something remarkable
        </h1>
        <p class="mt-6 max-w-2xl text-lg text-white">
          Atrium Auctionarium is an auction house for students. Create listings,
          bid with credits and find rare things from people like you.
        </p>
        <div class="mt-8 flex flex-wrap gap-4">
          <a
            href="/listings.html"
            class="rounded bg-[#D4AF37] px-4 py-2 font-semibold text-black hover:bg-[#F4D18B] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#F4D18B]"
            >Browse listings</a
          >
          <a
            id="register-link"
            href="/register.html"
            class="rounded border border-[#D4AF37] px-4 py-2 hover:bg-[#D4AF37] hover:text-black focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#F4D18B]"
            >Register</a
          >
        </div>
      </section>

      <section class="py-8">
        <h2 class="font-display text-2xl text-[#F4D18B]">Ending soon</h2>
        <p id="ending-status" role="status" class="mt-2 min-h-6"></p>
        <ul
          id="ending-soon"
          class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></ul>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/index.ts"></script>
  </body>
</html>
