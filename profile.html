<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300..700&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Atrium Auctionarium</title>
  </head>
  <body class="min-h-screen flex flex-col bg-[#0B0B0C] text-[#F4D18B]">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="mx-auto w-full max-w-3xl flex-1 px-6 pt-12 pb-24">
      <h1 id="profile-title" class="sr-only">Profile</h1>
      <p id="profile-status" role="status" class="min-h-6"></p>
      <div id="profile-content" class="mt-6"></div>
      <a
        href="/edit-profile.html"
        class="mt-6 inline-block rounded border border-[#D4AF37] px-4 py-2 hover:bg-[#D4AF37] hover:text-black focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#F4D18B]"
        >Edit profile</a
      >
      <section class="mt-12">
        <h2 class="font-display text-2xl text-[#F4D18B]">My listings</h2>
        <p id="my-listings-status" role="status" class="mt-2 min-h-6"></p>
        <ul
          id="my-listings"
          class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></ul>
      </section>
      <section class="mt-12">
        <h2 class="font-display text-2xl text-[#F4D18B]">My bids</h2>
        <p id="my-bids-status" role="status" class="mt-2 min-h-6"></p>
        <ul id="my-bids" class="mt-6 space-y-3"></ul>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/profile.ts"></script>
  </body>
</html>
